<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9784F"/>
      <stop offset="1" stop-color="#B8552E"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE7C2"/>
      <stop offset="1" stop-color="#FFD0A8"/>
    </linearGradient>
    <clipPath id="photo">
      <rect x="292" y="332" width="440" height="440" rx="44"/>
    </clipPath>
  </defs>

  <!-- Hintergrund (nur im App-Icon; für das transparente Logo wird diese Gruppe entfernt) -->
  <g id="background">
    <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  </g>

  <g id="foreground">
    <!-- hinteres Foto -->
    <g transform="rotate(-10 512 512)">
      <rect x="268" y="292" width="440" height="440" rx="44" fill="#FFF4E8" opacity="0.92"/>
    </g>
    <!-- mittleres Foto -->
    <g transform="rotate(6 512 512)">
      <rect x="284" y="300" width="440" height="440" rx="44" fill="#FFFFFF" opacity="0.96"/>
    </g>
    <!-- vorderes Foto mit Motiv -->
    <rect x="272" y="312" width="480" height="480" rx="56" fill="#FFFFFF"/>
    <g clip-path="url(#photo)">
      <rect x="292" y="332" width="440" height="440" fill="url(#sky)"/>
      <circle cx="612" cy="450" r="62" fill="#F2B24C"/>
      <path d="M292 700 C 380 600, 460 610, 540 660 C 600 700, 660 700, 732 640 L 732 772 L 292 772 Z" fill="#8FA88C"/>
      <path d="M292 772 L 292 690 C 360 640, 430 650, 500 700 C 560 745, 640 740, 732 690 L 732 772 Z" fill="#6B7F6A"/>
    </g>
    <!-- Herz -->
    <path transform="translate(560 226) scale(3.4)" fill="#FFFFFF" d="M23.6 4.6c-2.6 0-4.9 1.4-6.1 3.5C16.3 6 14 4.6 11.4 4.6 7.3 4.6 4 7.9 4 12c0 6.5 8.8 12.2 13.5 15.8C22.2 24.2 31 18.5 31 12c0-4.1-3.3-7.4-7.4-7.4z"/>
  </g>
</svg>
