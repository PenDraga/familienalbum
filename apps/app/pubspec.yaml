name: familienalbum
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+5

environment:
  sdk: ^3.13.2

dependencies:
  cached_network_image: ^4.0.0
  cached_network_image_platform_interface: ^5.0.0
  crypto: ^3.0.7
  dio: ^5.11.1
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.0.0
  go_router: ^18.0.1
  intl: ^0.20.3
  mime: ^2.1.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  video_player: ^2.14.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  photo_manager: ^3.12.0
  workmanager: ^0.10.9
  connectivity_plus: ^7.3.1
  flutter_image_compress: ^2.5.1
  share_plus: ^13.3.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/icon.png

# App-Icons: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  adaptive_icon_background: "#B8552E"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#B8552E"
    theme_color: "#B8552E"
  windows:
    generate: true
    image_path: assets/branding/icon.png
    icon_size: 256

# Splash: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#B8552E"
  color_dark: "#B8552E"
  image: assets/branding/splash.png
  android_12:
    color: "#B8552E"
    color_dark: "#B8552E"
    image: assets/branding/splash.png
  web: false
