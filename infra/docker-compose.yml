# Familienalbum – kompletter Stack. Aufruf aus diesem Ordner: `docker compose up -d --build`
# Build-Kontext ist das Repo-Root, damit die Images direkt aus dem Git-Checkout gebaut werden
# (API: apps/api/Dockerfile, Web + Caddy: apps/app/Dockerfile).
name: familienalbum

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${POSTGRES_PATH:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ${REDIS_PATH:-./data/redis}:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # API (Fastify). Spielt beim Start die Prisma-Migrationen ein.
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: familienalbum-api:local
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      MEDIA_ROOT: /data/media
      MEDIA_PROCESSING: queue
    volumes:
      - ${MEDIA_PATH:-./data/media}:/data/media
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Medien-Worker (BullMQ): gleiches Image, anderer Entrypoint
  worker:
    image: familienalbum-api:local
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      MEDIA_ROOT: /data/media
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    volumes:
      - ${MEDIA_PATH:-./data/media}:/data/media
      - ./secrets:/run/secrets:ro
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  # Caddy mit dem im Image gebauten Flutter-Web-Build; proxied /api an die API.
  # Ohne Tunnel im LAN erreichbar unter http://<host>:${HTTP_PORT}
  caddy:
    build:
      context: ..
      dockerfile: apps/app/Dockerfile
    image: familienalbum-web:local
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_started

  # Cloudflare Tunnel (kein Port-Forwarding). Nur mit `--profile tunnel` und gesetztem Token:
  #   docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run', '--token', '${CLOUDFLARE_TUNNEL_TOKEN}']
    profiles: ['tunnel']
    depends_on:
      caddy:
        condition: service_started
