# Familienalbum – kompletter Stack. Aufruf aus diesem Ordner: `docker compose up -d`
# Die Images baut GitHub Actions (.github/workflows/images.yml) und veröffentlicht sie in der
# GitHub Container Registry; hier wird nur gezogen. IMAGE_TAG (Standard latest) wählt die Version.
# Selbst bauen (Repo-Checkout nötig): docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
name: familienalbum

# Gemeinsame Umgebung für API und Worker (Pflicht: JWT_SECRET, Postgres-Zugang; Rest hat Standardwerte)
x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  MEDIA_ROOT: /data/media
  JWT_SECRET: ${JWT_SECRET}
  ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-86400}
  NOTIFY_DIGEST_SECONDS: ${NOTIFY_DIGEST_SECONDS:-90}
  FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Admin}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${POSTGRES_PATH:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ${REDIS_PATH:-./data/redis}:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # API (Fastify). Spielt beim Start die Prisma-Migrationen ein.
  api:
    image: ghcr.io/pendraga/familienalbum-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Werte kommen per Variablen-Ersetzung aus der .env neben dieser Datei oder aus den Stack-Variablen
    # des Managers (Dockhand, Portainer) – siehe x-api-env oben
    environment:
      <<: *api-env
      HOST: 0.0.0.0
      PORT: 3000
      MEDIA_PROCESSING: queue
    volumes:
      - ${MEDIA_PATH:-./data/media}:/data/media
      - ${SECRETS_PATH:-./secrets}:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Medien-Worker (BullMQ): gleiches Image, anderer Entrypoint
  worker:
    image: ghcr.io/pendraga/familienalbum-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      <<: *api-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    volumes:
      - ${MEDIA_PATH:-./data/media}:/data/media
      - ${SECRETS_PATH:-./secrets}:/run/secrets:ro
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  # Caddy mit dem im Image gebauten Flutter-Web-Build; proxied /api an die API.
  # Ohne Tunnel im LAN erreichbar unter http://<host>:${HTTP_PORT}
  caddy:
    image: ghcr.io/pendraga/familienalbum-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8090}:80'
    # Caddyfile liegt im Image (infra/Caddyfile); zum Anpassen als Bind-Mount ergänzen:
    #   volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro']
    depends_on:
      api:
        condition: service_started

  # Cloudflare Tunnel (kein Port-Forwarding). Nur mit `--profile tunnel` und gesetztem Token:
  #   docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run', '--token', '${CLOUDFLARE_TUNNEL_TOKEN}']
    profiles: ['tunnel']
    depends_on:
      caddy:
        condition: service_started
